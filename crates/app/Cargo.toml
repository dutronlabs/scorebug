[package]
name = "scorebug-app"
description = "scorebug desktop shell: ticker overlay, grid window, tray"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "scorebug"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
scorebug-core = { path = "../core" }
scorebug-providers = { path = "../providers" }
scorebug-sim = { path = "../sim" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }

[features]
# Serve the built UI from the binary instead of the Vite dev server.
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
